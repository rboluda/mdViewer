<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP: solo recursos propios. Las imágenes pueden venir de disco (host virtual del documento)
      o de internet; los scripts nunca salen del paquete de la app.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http: https://doc.mdviewer; media-src 'self' https: https://doc.mdviewer; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'"
    />
    <title>mdViewer</title>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
